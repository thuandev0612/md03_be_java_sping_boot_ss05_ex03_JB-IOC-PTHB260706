spring.application.name=baitapSession05

# Keep this machine's database login outside the folder uploaded to GitHub.
spring.config.import=optional:file:../.local-config/baitapSession05.properties,optional:file:./config/application-local.properties

# PostgreSQL must already contain this database; Hibernate creates the tables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/course_management_session05}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Create missing tables and update their structure from the entity mappings.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
